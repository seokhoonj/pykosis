[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pykosis"
version = "0.1.0"
description = "Python client for the KOSIS (Korean Statistical Information Service) Open API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["kosis", "statistics korea", "korea", "official statistics", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kosis = "pykosis.cli:main"

[project.urls]
Homepage = "https://github.com/seokhoonj/pykosis"
Source = "https://github.com/seokhoonj/pykosis"
Issues = "https://github.com/seokhoonj/pykosis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pykosis"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated: a few Korean indicator names push the spec line past the limit.
"src/pykosis/curation/_generated.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
